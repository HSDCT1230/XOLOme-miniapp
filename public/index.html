<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XOLOme Miniapp</title>
  <style>
    :root {
      --bg: #0f1410;
      --fg: #e8f0e6;
      --muted: #9aab9a;
      --accent: #3d8b5f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--fg);
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%, #1a2e22 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 80%, #1a2430 0%, transparent 50%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main { max-width: 36rem; text-align: center; }
    h1 {
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0 0 0.75rem;
    }
    p { margin: 0 0 1.5rem; color: var(--muted); line-height: 1.6; }
    a {
      color: var(--fg);
      text-decoration: none;
      border-bottom: 1px solid var(--accent);
      padding-bottom: 0.1em;
    }
    a:hover { color: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>XOLOme Miniapp</h1>
    <p>微信小程序仓库同步站点。请用微信开发者工具打开本机仓库中的 <code>xolome-miniapp/</code> 目录。</p>
    <p><a href="https://github.com/HSDCT1230/XOLOme-miniapp">GitHub：HSDCT1230/XOLOme-miniapp</a></p>
  </main>
</body>
</html>
